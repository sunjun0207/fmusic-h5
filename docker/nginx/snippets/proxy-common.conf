# 每个 /proxy/* location 都 include 本文件。
# 注意:
#  - nginx 的 proxy_set_header 只要在当前层级出现一个,就不再继承上层,
#    因此这里把完整的一组写全,单个 location 需要覆盖时(如 kw-nmobi 的 User-Agent)再追加。
#  - 除 proxy_set_header / proxy_hide_header 外,同一指令在同一层级出现两次会报 "directive is duplicate",
#    所以超时等需要按 location 覆盖的指令不要放在这里,而是放在 app-locations 的 server 层级。

proxy_http_version 1.1;
proxy_set_header Connection "";
# Host 用 proxy_pass 里的上游主机(等价于 vite proxy 的 changeOrigin: true)
proxy_set_header Host $proxy_host;
# 不把本站 Cookie 透传给第三方
proxy_set_header Cookie "";
proxy_set_header Accept-Encoding "";

# 上游为 https 时需要 SNI;酷我证书链在 alpine 上偶有校验问题,这里不校验(与 vite 代理行为一致)
proxy_ssl_server_name on;
proxy_ssl_protocols TLSv1.2 TLSv1.3;
proxy_ssl_verify off;

# 上游返回的 CORS / Cookie 头对同源反代无意义,去掉避免干扰
proxy_hide_header Set-Cookie;
proxy_hide_header Access-Control-Allow-Origin;
