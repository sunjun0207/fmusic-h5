# fmusic-h5 测试 / 开发服务器:用 .env.dev 构建,nginx 终结 TLS 并反代 /proxy/*。
#
# 构建:pnpm run docker:dev:build
# 启动:pnpm run docker:dev:up
# 日志:pnpm run docker:dev:logs
# 停止:pnpm run docker:dev:down
#
# HTTPS:把 PEM 放到 docker/dev/ssl/(已 .gitignore),文件名与 certbot 默认一致:
#   fullchain.pem = 服务器证书 + 中间证书;privkey.pem = 私钥。
#   若只有 cert.pem + chain.pem:cat cert.pem chain.pem > fullchain.pem
#   两个文件未放齐时 bind mount 会把缺失文件创建成目录,容器启动脚本会报错退出;
#   没有证书时可临时把 SSL_ENABLED 改为 'false' 并注释 443 端口与 ssl 卷。
#
# 域名 / 端口通过环境变量或项目根目录 .env(已 .gitignore)传入:
#   SERVER_NAME=music-dev.example.com HTTP_PORT=80 HTTPS_PORT=443
# DNS A 记录指向服务器,安全组放行 TCP 80/443;证书须包含该域名。
#
# 与 docker-compose.pro.yml 默认端口相同,勿在同一台机器上同时启动两套,或用 HTTP_PORT / HTTPS_PORT 错开。
# project name 独立,up/down 不会影响 local / pro 栈。

name: fmusic-h5-dev

services:
  fmusic-h5:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_MODE: dev
        NPM_REGISTRY: https://registry.npmmirror.com
        ALPINE_APK_REPO_MIRROR: https://mirrors.aliyun.com
    image: fmusic-h5:dev
    container_name: fmusic-h5-dev
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      TZ: Asia/Shanghai
      SSL_ENABLED: 'true'
      SERVER_NAME: ${SERVER_NAME:-_}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./docker/dev/ssl/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - ./docker/dev/ssl/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
      # certbot --webroot 续期时打开:
      # - ./docker/dev/certbot-www:/var/www/certbot:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
