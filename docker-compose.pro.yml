# fmusic-h5 生产:用 .env.pro 构建,nginx 终结 TLS 并反代 /proxy/*。
#
# 构建:pnpm run docker:pro:build
#   (基础镜像可覆盖为自有 ACR:docker compose -f docker-compose.pro.yml build \
#      --build-arg NODE_IMAGE=xxx/node:20-alpine3.20 --build-arg NGINX_IMAGE=xxx/nginx:1.27-alpine)
# 启动:pnpm run docker:pro:up
# 日志:pnpm run docker:pro:logs
# 停止:pnpm run docker:pro:down
#
# HTTPS:证书放 docker/pro/ssl/fullchain.pem + privkey.pem(已 .gitignore),说明见 docker-compose.dev.yml。
# 域名 / 端口:SERVER_NAME=music.example.com HTTP_PORT=80 HTTPS_PORT=443(可写在根目录 .env)。
# 时区:TZ=Asia/Shanghai,与 Dockerfile 内 tzdata 一致,docker logs 时间为北京时间。
# project name 独立,up/down 不会影响 local / dev 栈。

name: fmusic-h5-pro

services:
  fmusic-h5:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_MODE: pro
        NPM_REGISTRY: https://registry.npmmirror.com
        ALPINE_APK_REPO_MIRROR: https://mirrors.aliyun.com
    image: fmusic-h5:pro
    container_name: fmusic-h5
    restart: unless-stopped
    env_file:
      - .env.pro
    environment:
      TZ: Asia/Shanghai
      SSL_ENABLED: 'true'
      SERVER_NAME: ${SERVER_NAME:-_}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./docker/pro/ssl/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - ./docker/pro/ssl/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
      # certbot --webroot 续期时打开:
      # - ./docker/pro/certbot-www:/var/www/certbot:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
